name: CPU correctness

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install the recorded CPU validation stack
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install triton==3.1.0
          python -m pip install -e '.[test]'
      - name: Check environment
        run: python -m gpu_prep.check_env
      - name: Run correctness tests
        run: python -m pytest -q
      - name: Run formula and compile capture demonstrations
        run: |
          python examples/torch_layers_demo.py --device cpu
          python examples/compile_demo.py --device cpu --backend eager --include-cond
          python -m gpu_prep.roofline
